name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install project libraries
        run: dkp-pacman -Syu --noconfirm 3ds-curl 3ds-mbedtls 3ds-zlib citro2d citro3d
      - name: Build 3DSX
        run: |
          make
          cp Pixelnaute.3dsx N3DSWeb.3dsx
      - uses: softprops/action-gh-release@v2
        with:
          files: N3DSWeb.3dsx
