name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify release tag
        run: |
          version="$(sed -n 's/^#define NW_VERSION_STRING "\([^"]*\)"/\1/p' source/common.hpp)"
          short_version="${version%.0}"
          if [ -z "$version" ] || {
            [ "$GITHUB_REF_NAME" != "v$version" ] &&
            [ "$GITHUB_REF_NAME" != "v$short_version" ]
          }; then
            echo "Release tag $GITHUB_REF_NAME does not match application version v$version (or v$short_version)"
            exit 1
          fi
      - name: Install project libraries
        run: dkp-pacman -Syu --noconfirm 3ds-curl 3ds-mbedtls 3ds-zlib citro2d citro3d 3dstools
      - name: Install makerom
        run: |
          curl -fsSLo /tmp/makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
          echo "287b809dec064e0ad597e3d272c49ecb7eed41693d5ee6fef9d8a8aa24c2497e  /tmp/makerom.zip" | sha256sum --check
          unzip -p /tmp/makerom.zip makerom > /usr/local/bin/makerom
          chmod +x /usr/local/bin/makerom
      - name: Build 3DSX and CIA
        run: make cia
      - uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          files: |
            N3DSWeb.3dsx
            N3DSWeb.cia
            LICENSE
